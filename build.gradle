plugins {
	// Loom for unobfuscated Minecraft (26.x): uses Mojang's official names, no remapping.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft, Fabric and Mojang repositories automatically.
	maven {
		name = 'TerraformersMC (Mod Menu)'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
}

// Mod Menu (optional, FR-12.3): compiled against, never bundled or required. One version per Minecraft version.
def modMenuVersions = ['26.2': '20.0.3', '26.3': '21.0.0']
def modMenuVersion = modMenuVersions[project.minecraft_version]
if (modMenuVersion == null) {
	throw new GradleException("No Mod Menu version for Minecraft ${project.minecraft_version}: add one to modMenuVersions in build.gradle")
}

// Version-specific source: src/main/versions/<minecraft_version>/java holds the few classes whose code differs
// between Minecraft versions (each version keeps the same class names and public API). See docs/PORTING.md.
def versionSources = file("src/main/versions/${project.minecraft_version}/java")
if (!versionSources.isDirectory()) {
	throw new GradleException("No version-specific sources for Minecraft ${project.minecraft_version}: expected ${versionSources}")
}
sourceSets.main.java.srcDir versionSources

// Client game tests (src/gametest): launch the real game and drive it. Run with ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "soundsculptor-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Game tests run like a release build: no per-sound log lines (M1's SoundLogger), so timings are not distorted.
// -Psoak=<seconds> lengthens the stress test's soak phase (PRD 11.2 step 5: 1800 for the full 30 minutes).
loom {
	runs {
		matching { it.name == 'clientGameTest' }.configureEach {
			vmArg '-Dsoundsculptor.logSounds=false'
			vmArg "-Dsoundsculptor.soakSeconds=${project.findProperty('soak') ?: '20'}"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "com.terraformersmc:modmenu:${modMenuVersion}"
	// -Pmodmenu=true runs the dev client and the game tests with Mod Menu installed.
	if (project.findProperty('modmenu') == 'true') {
		localRuntime "com.terraformersmc:modmenu:${modMenuVersion}"
	}

	// Pure-logic unit tests that run without Minecraft (PRD 7.6).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def props = [version: project.version, minecraft_version: project.minecraft_version]
	inputs.properties props

	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from('LICENSE') {
		rename { "${it}_${projectName}" }
	}
}
