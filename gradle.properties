# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric toolchain (check https://fabricmc.net/develop before bumping).
# Default target is Minecraft 26.3. To build for 26.2, override on the command line:
#   ./gradlew build -Pminecraft_version=26.2 -Pfabric_api_version=0.161.0+26.2
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.4
fabric_api_version=0.165.2+26.3

# Test dependencies (pure-logic unit tests, PRD section 7.6)
junit_version=6.1.3

# Mod properties
mod_version=0.1.0-alpha
maven_group=io.github.jekitchen
archives_base_name=soundsculptor
