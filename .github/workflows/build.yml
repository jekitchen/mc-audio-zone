# Builds the mod and runs the pure-logic unit tests for every supported Minecraft version on every push and pull
# request, then checks that every version built the same jar (one jar ships for all of them, docs/PORTING.md).
name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.2'
            fabric_api: '0.161.0+26.2'
          - minecraft: '26.3'
            fabric_api: '0.165.2+26.3'
    name: build (Minecraft ${{ matrix.minecraft }})
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build and test
        run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_api_version=${{ matrix.fabric_api }}
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: soundsculptor-mc${{ matrix.minecraft }}
          path: build/libs/

  # The jar must be byte-for-byte the same whichever Minecraft version it was compiled against, so the one jar that
  # ships is exactly what each version's build and game tests checked.
  same-jar:
    needs: build
    runs-on: ubuntu-24.04
    name: same jar for every Minecraft version
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: collect every version's build
        uses: actions/download-artifact@v8
        with:
          pattern: soundsculptor-mc*
          path: builds
      - name: compare the jars
        run: |
          set -euo pipefail
          jars=()
          for dir in builds/*/; do
            jars+=("$(find "$dir" -maxdepth 1 -name 'soundsculptor-*.jar' ! -name '*-sources.jar')")
          done
          if [ "${#jars[@]}" -lt 2 ]; then
            echo "expected a jar from every Minecraft version, found: ${jars[*]}" >&2
            exit 1
          fi
          for jar in "${jars[@]:1}"; do
            java tools/CompareJars.java "${jars[0]}" "$jar"
          done
          mkdir dist
          cp "${jars[0]}" dist/
      - name: capture the jar
        uses: actions/upload-artifact@v7
        with:
          name: soundsculptor
          path: dist/

  client-gametest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mod Menu is optional (FR-12.3): 26.2 runs without it, 26.3 with it, so every run checks both.
          - minecraft: '26.2'
            fabric_api: '0.161.0+26.2'
            modmenu: 'false'
          - minecraft: '26.3'
            fabric_api: '0.165.2+26.3'
            modmenu: 'true'
    name: client game tests (Minecraft ${{ matrix.minecraft }})
    # A game that cannot create a window hangs instead of exiting; fail fast instead of after 6 hours.
    timeout-minutes: 20
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      # Loom wraps the game in xvfb-run by itself when CI is set, so no outer xvfb-run is needed.
      # Mesa provides software OpenGL and Vulkan; 26.3's renderer tries both (same setup as Fabric API's CI).
      - name: install virtual display and software graphics drivers
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run client game tests
        # Runners have no audio device; OpenAL Soft's silent "null" output keeps the sound engine running
        # so the sound tests (M1 onward) can observe sounds.
        env:
          ALSOFT_DRIVERS: 'null'
        run: ./gradlew runClientGameTest -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_api_version=${{ matrix.fabric_api }} -Pmodmenu=${{ matrix.modmenu }}
      - name: capture screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-mc${{ matrix.minecraft }}
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
